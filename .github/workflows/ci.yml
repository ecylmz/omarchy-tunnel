name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("manifest.json","utf8")); const req=["schemaVersion","id","name","version","author","kinds","entryPoints"]; for (const k of req) if (m[k] === undefined) throw new Error(`missing ${k}`); if (m.id.startsWith("omarchy.")) throw new Error("reserved plugin id"); if (!m.entryPoints.barWidget) throw new Error("missing barWidget entry point"); if (!fs.existsSync(m.entryPoints.barWidget)) throw new Error("barWidget entry point not found");'
      - name: Reject repository symlinks
        run: test -z "$(find . -type l -print -quit)"
      - name: Validate lint harness syntax
        run: bash -n tests/lint.sh
      - name: Run model tests
        run: node tests/model.test.js
      - name: Check security invariants
        run: |
          ! grep -R -nE 'NOPASSWD|sudoers|wg-quick' --include='*.qml' --include='*.js' .
          ! grep -R -nE '(bash|sh)[[:space:]]*,[[:space:]]*"-c"' --include='*.qml' .
